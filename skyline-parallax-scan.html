<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skyline Parallax Scan</title>
  <style>
    :root {
      --night: #04070d;
      --mist: #0f1730;
      --line: #64f7ff;
      --line-soft: rgba(100, 247, 255, 0.2);
      --text: #e9fbff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: "Century Gothic", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 40% 20%, #16294e 0%, transparent 48%),
        radial-gradient(circle at 75% 12%, #401a51 0%, transparent 42%),
        linear-gradient(to top, var(--night), var(--mist));
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.78) 1px, transparent 1px),
        radial-gradient(circle, rgba(255, 255, 255, 0.45) 1px, transparent 1px);
      background-size: 140px 140px, 90px 90px;
      background-position: 20px 10px, 50px 45px;
      opacity: 0.55;
      animation: driftStars 25s linear infinite;
      pointer-events: none;
    }

    .meteors {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .meteor {
      position: absolute;
      top: -12%;
      right: -25%;
      left: auto;
      width: clamp(130px, 22vw, 260px);
      height: 2px;
      border-radius: 999px;
      transform: rotate(-45deg);
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.95),
        rgba(100, 247, 255, 0.72) 22%,
        rgba(255, 255, 255, 0)
      );
      filter: drop-shadow(0 0 6px rgba(100, 247, 255, 0.9));
      opacity: 0;
      animation: meteorFall var(--dur, 9.2s) ease-in-out var(--delay, 0s) infinite;
    }

    .meteor::before {
      content: "";
      position: absolute;
      left: -3px;
      top: 50%;
      width: 6px;
      height: 6px;
      transform: translateY(-50%);
      border-radius: 50%;
      background: #eaffff;
      box-shadow: 0 0 12px rgba(100, 247, 255, 0.95);
    }

    .city {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50vh;
      display: flex;
      align-items: flex-end;
      gap: 0.6vw;
      padding: 0 0.8vw;
      transform: translateZ(0);
    }

    .tower {
      flex: 1;
      min-width: 18px;
      background:
        linear-gradient(to top, rgba(6, 14, 31, 0.95), rgba(22, 43, 85, 0.8));
      position: relative;
      border-top: 2px solid rgba(100, 247, 255, 0.25);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      animation: rise 1.3s ease-out both;
    }

    .tower::before {
      content: "";
      position: absolute;
      inset: 8% 18% 10%;
      background-image: repeating-linear-gradient(
        to bottom,
        rgba(100, 247, 255, 0.45) 0,
        rgba(100, 247, 255, 0.45) 2px,
        transparent 2px,
        transparent 7px
      );
      opacity: 0.35;
      animation: flicker 2.2s steps(3) infinite;
    }

    .tower:nth-child(odd) { height: calc(18vh + 22vh * var(--h)); }
    .tower:nth-child(even) { height: calc(14vh + 26vh * var(--h)); }

    .hero {
      position: relative;
      z-index: 2;
      text-align: center;
      width: min(930px, 92vw);
      margin-bottom: 30vh;
      animation: fadeIn 1.2s ease-out both;
    }

    h1 {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: clamp(2rem, 6.6vw, 4.7rem);
      text-shadow: 0 0 28px rgba(100, 247, 255, 0.35);
    }

    p {
      margin: 1rem auto 0;
      max-width: 680px;
      color: rgba(233, 251, 255, 0.82);
      line-height: 1.6;
      font-size: clamp(0.95rem, 2vw, 1.12rem);
    }

    @keyframes meteorFall {
      0% {
        transform: translate3d(0, 0, 0) rotate(-45deg);
        opacity: 0;
      }
      14% { opacity: 0.92; }
      76% { opacity: 0.92; }
      100% {
        transform: translate3d(-120vw, 120vh, 0) rotate(-45deg);
        opacity: 0;
      }
    }

    @keyframes driftStars {
      from { background-position: 20px 10px, 50px 45px; }
      to { background-position: 200px 210px, -120px 160px; }
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.55; }
    }

    @keyframes rise {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeIn {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="meteors" aria-hidden="true">
    <span class="meteor" style="--dur:10.6s; --delay:0.5s;"></span>
    <span class="meteor" style="--dur:9.8s; --delay:3.3s; top:-6%;"></span>
    <span class="meteor" style="--dur:11.4s; --delay:5.2s; top:2%;"></span>
    <span class="meteor" style="--dur:8.9s; --delay:2.1s; top:8%;"></span>
    <span class="meteor" style="--dur:12.1s; --delay:6.5s; top:14%;"></span>
    <span class="meteor" style="--dur:10.2s; --delay:4.1s; top:20%;"></span>
  </div>

  <main class="hero">
    <h1>Neo Skyline Intro</h1>
    <p>
      Layered city silhouettes, luminous windows, and drifting meteor streaks deliver a
      dramatic urban-tech landing visual ready for startup and SaaS homepages.
    </p>
  </main>

  <section class="city" aria-hidden="true">
    <div class="tower" style="--h:0.22"></div>
    <div class="tower" style="--h:0.58"></div>
    <div class="tower" style="--h:0.18"></div>
    <div class="tower" style="--h:0.7"></div>
    <div class="tower" style="--h:0.33"></div>
    <div class="tower" style="--h:0.82"></div>
    <div class="tower" style="--h:0.46"></div>
    <div class="tower" style="--h:0.61"></div>
    <div class="tower" style="--h:0.24"></div>
    <div class="tower" style="--h:0.72"></div>
    <div class="tower" style="--h:0.29"></div>
    <div class="tower" style="--h:0.66"></div>
    <div class="tower" style="--h:0.44"></div>
    <div class="tower" style="--h:0.77"></div>
    <div class="tower" style="--h:0.38"></div>
    <div class="tower" style="--h:0.56"></div>
    <div class="tower" style="--h:0.2"></div>
    <div class="tower" style="--h:0.63"></div>
    <div class="tower" style="--h:0.49"></div>
  </section>
</body>
</html>
