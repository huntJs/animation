<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Grid Reveal</title>
  <style>
    :root {
      --bg: #02050b;
      --teal: #23ffd0;
      --blue: #38a2ff;
      --ink: #93c8ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #0a1f3f 0%, #03060d 55%, #010205 100%);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: white;
      display: grid;
      place-items: center;
      perspective: 900px;
    }

    .scene {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .horizon {
      position: absolute;
      left: 50%;
      bottom: -10vh;
      width: 160vw;
      height: 120vh;
      transform: translateX(-50%) rotateX(73deg);
      background-image:
        linear-gradient(rgba(56, 162, 255, 0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(35, 255, 208, 0.28) 1px, transparent 1px);
      background-size: 65px 65px;
      animation: flow 7s linear infinite;
      mask-image: linear-gradient(to top, black 20%, transparent 85%);
      opacity: 0.75;
    }

    .scan {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.02) 0,
        rgba(255, 255, 255, 0.02) 2px,
        transparent 3px,
        transparent 8px
      );
      animation: scanLine 4s linear infinite;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    .sun {
      position: absolute;
      left: 50%;
      top: 18%;
      width: min(42vw, 380px);
      aspect-ratio: 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 35%, rgba(255, 255, 255, 0.9), rgba(56, 162, 255, 0.7) 30%, rgba(2, 6, 13, 0) 65%),
        conic-gradient(from 140deg, #2a90ff, #22ffd2, #4d6fff, #2a90ff);
      filter: blur(0.5px) drop-shadow(0 0 40px rgba(56, 162, 255, 0.55));
      animation: rotateSun 18s linear infinite;
    }

    .sun::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      animation: pulse 2.8s ease-in-out infinite;
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(920px, 92vw);
      text-align: center;
      margin-top: 3rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 5.2rem);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f2fbff;
      text-shadow: 0 0 18px rgba(35, 255, 208, 0.45);
      animation: reveal 1.5s ease-out both;
    }

    p {
      margin: 1rem auto 0;
      max-width: 640px;
      color: var(--ink);
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      line-height: 1.6;
      animation: reveal 1.5s 0.2s ease-out both;
    }

    @keyframes flow {
      from { background-position: 0 0, 0 0; }
      to { background-position: 0 65px, 65px 0; }
    }

    @keyframes rotateSun {
      from { transform: translateX(-50%) rotate(0deg); }
      to { transform: translateX(-50%) rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.75; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes scanLine {
      from { transform: translateY(-100%); }
      to { transform: translateY(100%); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="sun"></div>
    <div class="horizon"></div>
    <div class="scan"></div>
  </div>

  <main class="content">
    <h1>Cosmic Grid Gate</h1>
    <p>
      Retro-futuristic depth with a moving perspective grid, rotating plasma core, and
      scanning overlays to give your homepage an instant high-tech identity.
    </p>
  </main>
</body>
</html>
