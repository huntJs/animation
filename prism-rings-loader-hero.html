<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prism Rings Hero</title>
  <style>
    :root {
      --bg-1: #05020d;
      --bg-2: #191126;
      --text: #f8f4ff;
      --c1: #5ef2ff;
      --c2: #ff5f9f;
      --c3: #ffd15e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, #2b1845 0%, transparent 42%),
        radial-gradient(circle at 80% 85%, #1f385f 0%, transparent 45%),
        linear-gradient(165deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      font-family: "Lucida Sans", "Segoe UI", sans-serif;
    }

    .halo {
      position: absolute;
      width: min(78vmin, 640px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      animation: float 5.5s ease-in-out infinite;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
      mix-blend-mode: screen;
    }

    .r1 {
      width: 100%;
      height: 100%;
      border-top-color: var(--c1);
      border-left-color: rgba(94, 242, 255, 0.2);
      animation: spin 11s linear infinite;
      filter: drop-shadow(0 0 20px rgba(94, 242, 255, 0.5));
    }

    .r2 {
      width: 75%;
      height: 75%;
      border-right-color: var(--c2);
      border-bottom-color: rgba(255, 95, 159, 0.2);
      animation: spinReverse 8s linear infinite;
      filter: drop-shadow(0 0 18px rgba(255, 95, 159, 0.45));
    }

    .r3 {
      width: 48%;
      height: 48%;
      border-top-color: var(--c3);
      border-right-color: rgba(255, 209, 94, 0.24);
      animation: spin 5s linear infinite;
      filter: drop-shadow(0 0 16px rgba(255, 209, 94, 0.45));
    }

    .core {
      width: 25%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 28%, #ffffff, #9ad3ff 35%, #241034 72%);
      box-shadow: 0 0 42px rgba(94, 242, 255, 0.45);
      animation: breathe 2.6s ease-in-out infinite;
    }

    .hero {
      position: relative;
      z-index: 2;
      text-align: center;
      width: min(900px, 90vw);
      padding-top: 63vmin;
      max-width: 920px;
    }

    h1 {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: clamp(1.9rem, 5vw, 4rem);
      text-shadow: 0 0 18px rgba(255, 95, 159, 0.42);
    }

    p {
      margin: 1rem auto 0;
      max-width: 640px;
      line-height: 1.6;
      color: rgba(248, 244, 255, 0.84);
      font-size: clamp(0.94rem, 2vw, 1.1rem);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    @media (max-width: 720px) {
      .hero { padding-top: 78vmin; }
    }
  </style>
</head>
<body>
  <div class="halo" aria-hidden="true">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="core"></div>
  </div>

  <main class="hero">
    <h1>Prism Ring Reactor</h1>
    <p>
      Concentric spinning rings produce a premium sci-fi loading hero that works great
      as a splash intro, campaign opener, or startup transition scene.
    </p>
  </main>
</body>
</html>
