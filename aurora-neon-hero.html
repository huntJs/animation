<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Neon Hero</title>
  <style>
    :root {
      --bg-0: #04050d;
      --bg-1: #0d1026;
      --cyan: #19f5ff;
      --mint: #7affc6;
      --rose: #ff4eb9;
      --text: #ecf8ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, #1d2c66 0%, transparent 45%),
        radial-gradient(circle at 80% 30%, #3b145f 0%, transparent 42%),
        linear-gradient(130deg, var(--bg-0), var(--bg-1));
      position: relative;
      display: grid;
      place-items: center;
    }

    .aurora,
    .aurora::before,
    .aurora::after {
      position: absolute;
      inset: -20%;
      content: "";
      filter: blur(55px);
      mix-blend-mode: screen;
      opacity: 0.75;
      pointer-events: none;
    }

    .aurora {
      background: radial-gradient(closest-side, rgba(25, 245, 255, 0.95), transparent 75%);
      transform: translate(-20%, -10%);
      animation: driftA 12s ease-in-out infinite alternate;
    }

    .aurora::before {
      background: radial-gradient(closest-side, rgba(122, 255, 198, 0.95), transparent 72%);
      animation: driftB 15s ease-in-out infinite alternate;
    }

    .aurora::after {
      background: radial-gradient(closest-side, rgba(255, 78, 185, 0.92), transparent 70%);
      animation: driftC 18s ease-in-out infinite alternate;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(circle at center, black 35%, transparent 75%);
      animation: panGrid 18s linear infinite;
      opacity: 0.35;
    }

    .hero {
      width: min(920px, 92vw);
      padding: 2rem;
      text-align: center;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(8px);
    }

    .pill {
      display: inline-block;
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      letter-spacing: 0.08em;
      font-size: 0.76rem;
      text-transform: uppercase;
      margin-bottom: 1rem;
      background: rgba(8, 14, 30, 0.55);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 5rem);
      line-height: 1.05;
      text-transform: uppercase;
      text-shadow: 0 0 25px rgba(25, 245, 255, 0.45);
    }

    .highlight {
      background: linear-gradient(90deg, var(--cyan), var(--mint), var(--rose));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: hueShift 6s linear infinite;
    }

    p {
      margin: 1rem auto 1.8rem;
      max-width: 680px;
      color: rgba(236, 248, 255, 0.83);
      font-size: clamp(0.95rem, 2.2vw, 1.18rem);
      line-height: 1.6;
    }

    .cta {
      display: inline-block;
      padding: 0.9rem 1.45rem;
      border-radius: 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: white;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.03em;
      background: linear-gradient(120deg, rgba(25, 245, 255, 0.25), rgba(255, 78, 185, 0.25));
      box-shadow: 0 0 0 rgba(25, 245, 255, 0.55);
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes driftA {
      0% { transform: translate(-20%, -8%) scale(1); }
      100% { transform: translate(18%, 6%) scale(1.2); }
    }

    @keyframes driftB {
      0% { transform: translate(-5%, 18%) scale(0.9); }
      100% { transform: translate(30%, -15%) scale(1.25); }
    }

    @keyframes driftC {
      0% { transform: translate(25%, -20%) scale(1); }
      100% { transform: translate(-18%, 14%) scale(1.3); }
    }

    @keyframes panGrid {
      from { transform: translateY(0); }
      to { transform: translateY(38px); }
    }

    @keyframes hueShift {
      from { filter: hue-rotate(0deg); }
      to { filter: hue-rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 rgba(25, 245, 255, 0.2); }
      50% { box-shadow: 0 0 28px rgba(25, 245, 255, 0.65); }
    }
  </style>
</head>
<body>
  <div class="aurora"></div>
  <div class="grid"></div>

  <main class="hero">
    <span class="pill">Launch Sequence</span>
    <h1>Neon <span class="highlight">Aurora</span> Landing</h1>
    <p>
      A cinematic first-screen effect with layered light fields, moving energy clouds,
      and a soft futuristic glow that instantly creates a premium vibe.
    </p>
    <a class="cta" href="#">Explore Experience</a>
  </main>
</body>
</html>
